name: Contoso local delivery practice
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s practice/delivery -p "test_exercise.py" -v
