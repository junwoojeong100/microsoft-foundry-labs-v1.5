name: Validate offline workshop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acknowledge_cost:
        description: "Also run the separately approved Contoso Azure deployment/business check"
        required: false
        type: boolean
        default: false
      validation_phase:
        description: "dev never invokes holdout; release uses the sealed holdout only after dev approval"
        type: choice
        options: [dev, release, optimizer, auth, identity]
        default: dev
      language:
        description: "Select the isolated Korean or English Azure environment"
        type: choice
        options: [ko, en]
        default: ko
permissions:
  contents: read
jobs:
  azure:
    if: github.event_name == 'workflow_dispatch' && inputs.acknowledge_cost && github.repository_id == '1396573688'
    needs: [offline, sdk]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/azure-validation.yml
    with:
      acknowledge_cost: true
      validation_phase: ${{ inputs.validation_phase }}
      language: ${{ inputs.language }}
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt
      - run: python -m pip install -r requirements.txt -r requirements-docs.txt
      - run: python -m unittest discover -s tests -v
      - run: python samples/workshop.py validate-data
      - run: python scripts/build_guide.py
      - name: Generated HTML/Markdown must match the committed files
        run: git diff --exit-code -- index.html index.ko.html downloads/GUIDE.en.md downloads/GUIDE.ko.md
      - run: python scripts/check_guide.py
      - run: python scripts/build_hosted.py
      - run: python scripts/check_independence.py
      - name: The committed ZIP must match the sources
        run: python scripts/package_guide.py --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run guide:browser
  advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-advanced.txt
            requirements-local.txt
      - run: python -m pip install -r requirements-advanced.txt
      - run: python -m pip check
      - run: python scripts/check_sdk.py --advanced
      - name: The local-model environment installs cleanly
        run: |
          python -m venv .venv-local-check
          .venv-local-check/bin/python -m pip install -r requirements-local.txt
          .venv-local-check/bin/python -m pip check
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-hosted.txt -r requirements-tools.txt
      - run: python -m pip check
      - run: python scripts/check_sdk.py
      - run: python samples/toolbox_lab.py call --local --tool get_stock --arguments '{"sku":"NB-14"}' --approve-tool get_stock
