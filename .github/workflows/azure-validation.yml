name: Approved Contoso Azure validation
on:
  workflow_call:
    inputs:
      acknowledge_cost:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      acknowledge_cost:
        description: "Run paid deployment, one business smoke, judge controls, and supplied holdout evaluation"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: contoso-approved-azure-deployment
  cancel-in-progress: false
jobs:
  approved-test:
    if: github.repository == 'junwoojeong100/foundry-labs-v1.5' && inputs.acknowledge_cost
    environment: contoso-validation
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL_DEPLOYMENT_NAME: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT_NAME }}
      FOUNDRY_SEARCH_ENDPOINT: ${{ vars.FOUNDRY_SEARCH_ENDPOINT }}
      FOUNDRY_SEARCH_INDEX: ${{ vars.FOUNDRY_SEARCH_INDEX }}
      FOUNDRY_KNOWLEDGE_BASE: ${{ vars.FOUNDRY_KNOWLEDGE_BASE }}
      FOUNDRY_EMBEDDING_DEPLOYMENT_NAME: ${{ vars.FOUNDRY_EMBEDDING_DEPLOYMENT_NAME }}
      FOUNDRY_EMBEDDING_ENDPOINT: ${{ vars.FOUNDRY_EMBEDDING_ENDPOINT }}
      FOUNDRY_JUDGE_DEPLOYMENT_NAME: ${{ vars.FOUNDRY_JUDGE_DEPLOYMENT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-hosted.txt -r requirements-tools.txt
      - run: python -m pip check && python -m unittest discover -s tests -v
      - run: python scripts/build_hosted.py
      - uses: Azure/setup-azd@v2
        with:
          version: "1.34.0"
      - run: azd extension install azure.ai.agents --version 1.0.0-beta.10
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate azd using the same OIDC identity
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - run: python scripts/ci_live.py
      - name: Stop only recorded CI sessions
        if: always()
        run: python scripts/stop_sessions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contoso-ci-summary
          path: validation/current/ci.json
          if-no-files-found: warn
          retention-days: 7
