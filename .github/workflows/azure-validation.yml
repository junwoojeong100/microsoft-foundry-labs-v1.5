name: Approved Contoso Azure validation
on:
  workflow_call:
    inputs:
      acknowledge_cost:
        required: true
        type: boolean
      validation_phase:
        required: false
        type: string
        default: dev
      language:
        required: false
        type: string
        default: ko
  workflow_dispatch:
    inputs:
      acknowledge_cost:
        description: "Run paid deployment, one business smoke, judge controls, and supplied holdout evaluation"
        required: true
        type: boolean
        default: false
      validation_phase:
        type: choice
        options: [dev, release, optimizer, auth, identity]
        default: dev
      language:
        type: choice
        options: [ko, en]
        default: ko
permissions:
  contents: read
concurrency:
  group: contoso-approved-azure-${{ inputs.language }}-${{ inputs.validation_phase == 'optimizer' && 'optimizer' || 'deployment' }}
  cancel-in-progress: false
jobs:
  identity-probe:
    if: github.repository_id == '1396573688' && inputs.acknowledge_cost && inputs.validation_phase == 'identity' && (inputs.language == 'ko' || inputs.language == 'en')
    environment: ${{ inputs.language == 'en' && 'contoso-validation-en' || 'contoso-validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api://AzureADTokenExchange');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            if (claims.repository_id !== '1396573688') throw new Error('Unexpected repository identity.');
            core.info(JSON.stringify({
              sub: claims.sub, aud: claims.aud, repository_id: claims.repository_id,
              ref: claims.ref, environment: claims.environment,
              azure_calls: 0, token_printed: false
            }));
  approved-test:
    if: github.repository_id == '1396573688' && inputs.acknowledge_cost && inputs.validation_phase != 'identity' && (inputs.language == 'ko' || inputs.language == 'en')
    environment: ${{ inputs.language == 'en' && 'contoso-validation-en' || 'contoso-validation' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_LAB_LANGUAGE: ${{ inputs.language }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL_DEPLOYMENT_NAME: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT_NAME }}
      FOUNDRY_SEARCH_ENDPOINT: ${{ vars.FOUNDRY_SEARCH_ENDPOINT }}
      FOUNDRY_SEARCH_INDEX: ${{ vars.FOUNDRY_SEARCH_INDEX }}
      FOUNDRY_KNOWLEDGE_BASE: ${{ vars.FOUNDRY_KNOWLEDGE_BASE }}
      FOUNDRY_EMBEDDING_DEPLOYMENT_NAME: ${{ vars.FOUNDRY_EMBEDDING_DEPLOYMENT_NAME }}
      FOUNDRY_EMBEDDING_ENDPOINT: ${{ vars.FOUNDRY_EMBEDDING_ENDPOINT }}
      FOUNDRY_JUDGE_DEPLOYMENT_NAME: ${{ vars.FOUNDRY_JUDGE_DEPLOYMENT_NAME }}
      FOUNDRY_OPTIMIZER_AGENT_VERSION: ${{ vars.FOUNDRY_OPTIMIZER_AGENT_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-hosted.txt -r requirements-tools.txt -r requirements-docs.txt
      - run: python -m pip check && FOUNDRY_LAB_LANGUAGE=ko python -m unittest discover -s tests -v
      - run: python scripts/build_hosted.py
      - uses: Azure/setup-azd@v2
        with:
          version: "1.34.0"
      - run: AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd extension install azure.ai.agents --version 1.0.0-beta.10
      - run: AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd extension install azure.ai.projects --version 1.0.0-beta.6
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate azd using the same OIDC identity
        run: AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - run: AZURE_DEV_USER_AGENT=microsoft_foundry_skill python scripts/ci_live.py --phase "$VALIDATION_PHASE"
        env:
          VALIDATION_PHASE: ${{ inputs.validation_phase }}
      - name: Stop only recorded CI sessions
        if: always()
        run: AZURE_DEV_USER_AGENT=microsoft_foundry_skill python scripts/stop_sessions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contoso-ci-summary
          path: |
            validation/automated-v3/
            validation/optimizer-oidc/
            validation/english/
          if-no-files-found: warn
          retention-days: 7
