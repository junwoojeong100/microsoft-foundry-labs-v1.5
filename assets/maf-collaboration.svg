<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
  <title id="title">MAF bounded group chat and real handoff tool</title>
  <desc id="desc">Group chat runs drafter, reviewer, drafter and ends after three calls. Handoff requires a coordinator tool call and a specialist response, bounded to four model calls. The offline fixture always routes to policy, not model-based classification. No human approval or remote A2A execution occurs.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#487488" stroke-width="1.3"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#15364b}.title{font-weight:700;font-size:18px}.sub{font-size:14px}.line{stroke:#487488;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="370" rx="18" fill="#f8fbfc"/>
  <text x="28" y="35" class="title">GROUP CHAT / 3 CALLS, THEN STOP</text>
  <rect x="28" y="59" width="240" height="70" rx="10" fill="#e8f4ee" stroke="#afd8c2"/><text x="48" y="102" class="title">1. Drafter</text>
  <path d="M268 94H340" class="line"/>
  <rect x="342" y="59" width="240" height="70" rx="10" fill="#fff" stroke="#c3d8e0"/><text x="362" y="102" class="title">2. Reviewer</text>
  <path d="M582 94H654" class="line"/>
  <rect x="656" y="59" width="240" height="70" rx="10" fill="#e8f4ee" stroke="#afd8c2"/><text x="676" y="102" class="title">3. Drafter revises</text>
  <path d="M896 94H952" class="line"/><text x="968" y="102" class="title">End</text>
  <text x="28" y="185" class="title">HANDOFF / AT MOST 4 CALLS</text>
  <rect x="28" y="208" width="240" height="76" rx="10" fill="#fff" stroke="#c3d8e0"/><text x="48" y="252" class="title">Coordinator</text>
  <path d="M268 246H340" class="line"/>
  <rect x="342" y="208" width="330" height="76" rx="10" fill="#fff4dc" stroke="#dfcc98"/>
  <text x="362" y="239" class="title">Actual handoff tool call</text><text x="362" y="266" class="sub">handoff_to_policy / handoff_to_budget</text>
  <path d="M672 246H744" class="line"/>
  <rect x="746" y="208" width="306" height="76" rx="10" fill="#e8f4ee" stroke="#afd8c2"/><text x="766" y="252" class="title">Specialist replies; stop</text>
  <text x="28" y="320" class="sub">Offline fixture: fixed policy routing, 2 synthetic calls. Live routing must be observed; text claiming delegation is insufficient.</text>
  <text x="28" y="348" class="sub">Diagram, not a Microsoft Azure recording. Handoff is neither business approval nor remote A2A.</text>
</svg>
