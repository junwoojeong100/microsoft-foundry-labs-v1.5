<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Hosted Agent: source, package, deployment, invocation</title>
  <desc id="desc">Build the package offline. Separately approve Microsoft Azure deployment, runtime roles and one invocation of an exact version. The optional local server also calls Microsoft Azure services; it is not an offline fixture.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#487488" stroke-width="1.3"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#15364b}.title{font-weight:700;font-size:18px}.sub{font-size:14px}.line{stroke:#487488;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="360" rx="18" fill="#f8fbfc"/>
  <text x="28" y="36" class="title">HOSTED AGENT / INVOCATIONS 1.0.0</text>
  <rect x="28" y="64" width="488" height="160" rx="14" fill="#e8f4ee" stroke="#afd8c2"/>
  <text x="46" y="90" class="sub">OFFLINE: source inspection and packaging</text>
  <rect x="46" y="112" width="200" height="88" rx="10" fill="#fff" stroke="#c3d8e0"/>
  <text x="60" y="142" class="title">1. Source</text><text x="60" y="172" class="sub">hosted/main.py</text>
  <path d="M246 156H290" class="line"/>
  <rect x="292" y="112" width="206" height="88" rx="10" fill="#fff" stroke="#c3d8e0"/>
  <text x="308" y="142" class="title">2. Package</text><text x="308" y="172" class="sub">.build/contoso</text>
  <rect x="556" y="64" width="536" height="160" rx="14" fill="#fff4dc" stroke="#dfcc98"/>
  <text x="574" y="90" class="sub">SEPARATE APPROVAL: scope, roles, compute, model, Search</text>
  <path d="M498 156H574" class="line"/>
  <rect x="576" y="112" width="220" height="88" rx="10" fill="#fff" stroke="#c3d8e0"/>
  <text x="590" y="142" class="title">3. Deploy one service</text><text x="590" y="172" class="sub">contoso-purchasing</text>
  <path d="M796 156H838" class="line"/>
  <rect x="840" y="112" width="232" height="88" rx="10" fill="#fff" stroke="#c3d8e0"/>
  <text x="854" y="142" class="title">4. Invoke exact version</text><text x="854" y="172" class="sub">One request; stop owned session</text>
  <path d="M394 200V264H574" class="line"/>
  <rect x="576" y="242" width="496" height="66" rx="10" fill="#fff" stroke="#dfcc98"/>
  <text x="592" y="269" class="title">Optional local server: 127.0.0.1:8088</text>
  <text x="592" y="293" class="sub">Microsoft Azure backend: --local is not offline.</text>
  <text x="28" y="339" class="sub">Diagram, not a recorded deployment. Responses 2.0.0 is a separate service and protocol.</text>
</svg>
