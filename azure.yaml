name: contoso-independent-workshop
requiredVersions:
  azd: ">=1.34.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.10"
services:
  contoso-purchasing:
    host: azure.ai.agent
    project: .build/contoso
    language: python
    kind: hosted
    name: contoso-purchasing
    displayName: Contoso Purchasing Assistant
    description: Synthetic policy, inventory and purchase draft assistant; never orders or approves.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: invocations
        version: 1.0.0
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
      FOUNDRY_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_SEARCH_ENDPOINT: ${FOUNDRY_SEARCH_ENDPOINT}
      FOUNDRY_SEARCH_INDEX: ${FOUNDRY_SEARCH_INDEX}
      FOUNDRY_KNOWLEDGE_BASE: ${FOUNDRY_KNOWLEDGE_BASE}
      FOUNDRY_EMBEDDING_DEPLOYMENT_NAME: ${FOUNDRY_EMBEDDING_DEPLOYMENT_NAME}
      FOUNDRY_EMBEDDING_ENDPOINT: ${FOUNDRY_EMBEDDING_ENDPOINT}
      FOUNDRY_AUTH_MODE: managed_identity
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
  contoso-purchasing-responses:
    host: azure.ai.agent
    project: .build/contoso
    language: python
    kind: hosted
    name: contoso-purchasing-responses
    displayName: Contoso Purchasing Responses
    description: The same bounded Contoso engine with a Responses adapter for native optimization.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: responses_main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
      FOUNDRY_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_SEARCH_ENDPOINT: ${FOUNDRY_SEARCH_ENDPOINT}
      FOUNDRY_SEARCH_INDEX: ${FOUNDRY_SEARCH_INDEX}
      FOUNDRY_KNOWLEDGE_BASE: ${FOUNDRY_KNOWLEDGE_BASE}
      FOUNDRY_EMBEDDING_DEPLOYMENT_NAME: ${FOUNDRY_EMBEDDING_DEPLOYMENT_NAME}
      FOUNDRY_EMBEDDING_ENDPOINT: ${FOUNDRY_EMBEDDING_ENDPOINT}
      FOUNDRY_AUTH_MODE: managed_identity
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
